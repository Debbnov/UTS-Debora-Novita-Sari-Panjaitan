<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voucher Entri Transaksi Kas Keluar</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-8">
    
    <!-- Header -->
    <div class="border-b pb-4 mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Voucher Entri Transaksi Kas Keluar</h1>
        <p class="text-sm text-gray-500">Modul Sistem Informasi Akuntansi - Purwarupa Web</p>
      </div>
      <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold">Status: DRAFT</span>
    </div>

    <!-- Header Transaksi (journal_headers) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Transaksi</label>
        <input type="date" id="transaction_date" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Referensi/Voucher</label>
        <input type="text" id="reference_no" placeholder="BKK-2026-10-001" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan / Deskripsi</label>
        <input type="text" id="description" placeholder="Pembayaran Operasional..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
    </div>

    <!-- Tabel Baris Jurnal (journal_lines) -->
    <div class="mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-3">Detail Baris Jurnal</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 uppercase text-xs">
              <th class="p-3 border">Akun (CoA)</th>
              <th class="p-3 border w-40">Debit (Rp)</th>
              <th class="p-3 border w-40">Kredit (Rp)</th>
              <th class="p-3 border w-16 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="journal_rows">
            <!-- Baris dinamis akan muncul di sini -->
          </tbody>
        </table>
      </div>
      <button onclick="addRow()" class="mt-3 text-sm font-medium text-blue-600 hover:text-blue-800 flex items-center gap-1">
        + Tambah Baris Akun
      </button>
    </div>

    <!-- Live Balanced Indicator & Ringkasan Total -->
    <div class="bg-gray-50 p-4 rounded-lg border mb-6">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <!-- Indicator Status Balance -->
        <div id="balance_indicator" class="flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm bg-red-100 text-red-700">
          <span id="balance_icon">❌</span>
          <span id="balance_text">Jurnal Belum Seimbang (Discrepancy)</span>
        </div>

        <!-- Total Debit & Kredit -->
        <div class="flex gap-6 text-sm">
          <div>
            <span class="text-gray-500 block">Total Debit:</span>
            <span id="total_debit" class="font-bold text-base text-gray-800">Rp 0</span>
          </div>
          <div>
            <span class="text-gray-500 block">Total Kredit:</span>
            <span id="total_credit" class="font-bold text-base text-gray-800">Rp 0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-3">
      <button type="button" onclick="resetForm()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 text-sm font-medium">Reset</button>
      <button type="button" id="submit_btn" disabled class="px-6 py-2 bg-gray-400 text-white rounded-lg cursor-not-allowed text-sm font-medium transition-all">
        Posting Jurnal (Submit)
      </button>
    </div>

  </div>

  <!-- JavaScript Logic -->
  <script>
    const accounts = [
      { id: '1101', code: '1101', name: 'Kas Utama' },
      { id: '1102', code: '1102', name: 'Bank BCA' },
      { id: '2101', code: '2101', name: 'Utang Usaha' },
      { id: '5101', code: '5101', name: 'Beban Gaji' },
      { id: '5102', code: '5102', name: 'Beban Listrik & Air' },
      { id: '5103', code: '5103', name: 'Beban Perlengkapan' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('transaction_date').valueAsDate = new Date();
      addRow(); 
      addRow(); 
    });

    function addRow() {
      const tbody = document.getElementById('journal_rows');
      const tr = document.createElement('tr');
      tr.className = 'journal-row border-b';

      let optionsHTML = '<option value="">-- Pilih Akun --</option>';
      accounts.forEach(acc => {
        optionsHTML += `<option value="${acc.id}">${acc.code} - ${acc.name}</option>`;
      });

      tr.innerHTML = `
        <td class="p-2 border">
          <select class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-blue-500">${optionsHTML}</select>
        </td>
        <td class="p-2 border">
          <input type="number" min="0" value="0" oninput="calculateTotals()" class="debit-input w-full p-2 border rounded text-sm text-right focus:ring-1 focus:ring-blue-500">
        </td>
        <td class="p-2 border">
          <input type="number" min="0" value="0" oninput="calculateTotals()" class="credit-input w-full p-2 border rounded text-sm text-right focus:ring-1 focus:ring-blue-500">
        </td>
        <td class="p-2 border text-center">
          <button type="button" onclick="removeRow(this)" class="text-red-500 hover:text-red-700 font-bold">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
      calculateTotals();
    }

    function removeRow(btn) {
      const tbody = document.getElementById('journal_rows');
      if (tbody.children.length > 2) {
        btn.closest('tr').remove();
        calculateTotals();
      } else {
        alert('Jurnal minimal memiliki 2 baris transaksi (Debit & Kredit).');
      }
    }

    function calculateTotals() {
      let totalDebit = 0;
      let totalCredit = 0;

      document.querySelectorAll('.debit-input').forEach(input => {
        totalDebit += parseFloat(input.value) || 0;
      });

      document.querySelectorAll('.credit-input').forEach(input => {
        totalCredit += parseFloat(input.value) || 0;
      });

      document.getElementById('total_debit').innerText = 'Rp ' + totalDebit.toLocaleString('id-ID');
      document.getElementById('total_credit').innerText = 'Rp ' + totalCredit.toLocaleString('id-ID');

      const balanceIndicator = document.getElementById('balance_indicator');
      const balanceIcon = document.getElementById('balance_icon');
      const balanceText = document.getElementById('balance_text');
      const submitBtn = document.getElementById('submit_btn');

      const isBalanced = (totalDebit === totalCredit) && totalDebit > 0;

      if (isBalanced) {
        balanceIndicator.className = 'flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm bg-green-100 text-green-700';
        balanceIcon.innerText = '✅';
        balanceText.innerText = 'Jurnal Seimbang (Zero Discrepancy)';
        
        submitBtn.disabled = false;
        submitBtn.className = 'px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium cursor-pointer transition-all shadow-md';
      } else {
        balanceIndicator.className = 'flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm bg-red-100 text-red-700';
        balanceIcon.innerText = '❌';
        balanceText.innerText = totalDebit === 0 && totalCredit === 0 
          ? 'Masukkan Angka Transaksi' 
          : `Tidak Seimbang (Selisih: Rp ${Math.abs(totalDebit - totalCredit).toLocaleString('id-ID')})`;

        submitBtn.disabled = true;
        submitBtn.className = 'px-6 py-2 bg-gray-400 text-white rounded-lg cursor-not-allowed text-sm font-medium transition-all';
      }
    }

    function resetForm() {
      document.getElementById('journal_rows').innerHTML = '';
      addRow();
      addRow();
      document.getElementById('reference_no').value = '';
      document.getElementById('description').value = '';
    }
  </script>
</body>
</html>
